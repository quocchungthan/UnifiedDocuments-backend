name: Publish ProjectLoop images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: images
    runs-on: ubuntu-latest
    steps:
      - name: Check out ProjectLoop
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download latest frontend artifact
        id: frontend
        uses: actions/github-script@v7
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            if (!process.env.GH_PAT) {
              core.setFailed("Configure the GH_PAT Actions secret with read access to frontend workflow artifacts.");
              return;
            }

            const owner = "quocchungthan";
            const repo = "UnifiedDocuments-backend";
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: "vehicle-documents.yml",
              branch: "feat/ProjectLoop-frontend",
              status: "completed",
              per_page: 100,
            });
            const successfulRuns = runs
              .filter((run) => run.conclusion === "success")
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));

            let selected;
            for (const run of successfulRuns) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = artifacts.find((item) => item.name === "vehicle-documents-ui" && !item.expired);
              if (artifact) {
                selected = { run, artifact };
                break;
              }
            }

            if (!selected) {
              core.setFailed("No unexpired vehicle-documents-ui artifact was found on feat/ProjectLoop-frontend.");
              return;
            }

            const response = await github.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: selected.artifact.id,
              archive_format: "zip",
            });
            const archive = Buffer.from(response.data);
            const digest = require("node:crypto").createHash("sha256").update(archive).digest("hex");
            if (selected.artifact.digest && selected.artifact.digest !== `sha256:${digest}`) {
              core.setFailed("The downloaded frontend artifact failed its SHA-256 digest check.");
              return;
            }

            require("node:fs").writeFileSync("frontend-ui.zip", archive);
            core.info(`Selected frontend workflow run ${selected.run.id}, artifact ${selected.artifact.id}.`);

      - name: Extract frontend bundle
        run: |
          unzip -tq frontend-ui.zip
          mkdir -p frontend-bundle
          unzip -oq frontend-ui.zip -d frontend-bundle
          test -f frontend-bundle/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PROJECT_FILE=src/UnifiedDocuments/UnifiedDocuments.csproj
            INCLUDE_FRONTEND=true
          tags: |
            ghcr.io/quocchungthan/unifieddocuments-backend:latest
            ghcr.io/quocchungthan/unifieddocuments-backend:sha-${{ github.sha }}

      - name: Build and push Sales mock
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PROJECT_FILE=DealershipSystems/SalesSystem/SalesSystem.csproj
          tags: |
            ghcr.io/quocchungthan/unifieddocuments-backend-sales:latest
            ghcr.io/quocchungthan/unifieddocuments-backend-sales:sha-${{ github.sha }}

      - name: Build and push Service mock
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PROJECT_FILE=DealershipSystems/ServiceSystem/ServiceSystem.csproj
          tags: |
            ghcr.io/quocchungthan/unifieddocuments-backend-service:latest
            ghcr.io/quocchungthan/unifieddocuments-backend-service:sha-${{ github.sha }}

      - name: Build and push Warranty mock
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PROJECT_FILE=DealershipSystems/WarrantySystem/WarrantySystem.csproj
          tags: |
            ghcr.io/quocchungthan/unifieddocuments-backend-warranty:latest
            ghcr.io/quocchungthan/unifieddocuments-backend-warranty:sha-${{ github.sha }}