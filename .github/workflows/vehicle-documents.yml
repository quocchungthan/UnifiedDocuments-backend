name: Vehicle Documents UI bundle

on:
  push:
    branches:
      - feat/ProjectLoop-frontend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SingleUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: SingleUI/package-lock.json
      - run: npm ci
      - run: npm test -- --app=car-documents --watch=false --include="src/app-car-documents/*.spec.ts" --include="src/api/cars/vehicle-documents.spec.ts"
      - run: npm run build -- --app=car-documents
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-documents-ui
          path: SingleUI/dist/app-car-documents/browser/
          if-no-files-found: error
          retention-days: 30
      - name: Installation instructions
        run: |
          {
            echo '## Vehicle Documents UI'
            echo '- Download vehicle-documents-ui from this successful run.'
            echo '- Extract its contents into src/UnifiedDocuments/www in UnifiedDocuments-backend.'
            echo '- index.html must be directly inside www, not a nested browser folder.'
            echo '- Start the backend and open its root URL; no Angular server is required.'
            echo "- Source revision: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
